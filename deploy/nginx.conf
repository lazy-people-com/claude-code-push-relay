# push-relay nginx 反向代理配置
# 部署位置: /etc/nginx/conf.d/push-relay.conf
#
# 场景：Cloudflare 在前面提供 HTTPS（Flexible 或 Full 模式都行）
# - 用户浏览器 → Cloudflare：HTTPS（CF 证书）
# - Cloudflare → ycj nginx：HTTP（nginx 监听 80）
# - nginx → push-relay (8080)：HTTP（内网）
#
# 优势：
# - 不需要在 ycj 上管证书（CF 帮你管）
# - 80 端口直接 serve，无需 SSL 配置
# - 内部全 HTTP，配置简单
#
# 备用：如果 Cloudflare 挂了或想直接访问，可以同时启用 443（自签证书）

# 上游：push-relay 后端（内网 HTTP）
upstream push_relay_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# 限流:防 /api/tokens 爆破 master token
# 每 IP 每秒 5 次,burst 10
limit_req_zone $binary_remote_addr zone=tokens_limit:10m rate=5r/s;

# 上游:push-relay 后端(内网 HTTP)
upstream push_relay_backend_https {
    server 127.0.0.1:8080;
    keepalive 32;
}

# 主 server（Cloudflare Flexible/Full 模式都用 80）
server {
    listen 80;
    listen [::]:80;
    server_name yangchenjie.com www.yangchenjie.com;

    # Let's Encrypt 验证（如需要）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 安全头
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # 请求体大小限制
    client_max_body_size 1m;

    # ── 前端静态文件 ──
    location / {
        root /var/www/push-relay;
        index client.html;
        try_files $uri $uri/ /client.html;

        # HTML 不缓存，方便更新
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }
    }

    # ── Admin 页面(防止 SPA fallback 兜底成 client.html) ──
    # 注意: alias 不会自动根据 .html 设 Content-Type,必须显式 default_type,
    # 否则浏览器看到 application/octet-stream 会触发下载。
    location = /admin {
        alias /var/www/push-relay/admin.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }

    # ── API 反向代理（普通 HTTP） ──
    location /api/ {
        proxy_pass http://push_relay_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── Token 管理 API 限流(防 master 爆破) ──
    location /api/tokens {
        limit_req zone=tokens_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://push_relay_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket（独立 location 以支持 Upgrade 头） ──
    location /api/ws {
        proxy_pass http://push_relay_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接：超时设大
        proxy_connect_timeout 7s;
        proxy_send_timeout    86400s;
        proxy_read_timeout    86400s;

        # 禁用缓冲
        proxy_buffering off;
    }

    # nginx 层健康检查
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 日志
    access_log /var/log/nginx/push-relay.access.log;
    error_log  /var/log/nginx/push-relay.error.log;
}

# 备用: 443 HTTPS 监听(给 Cloudflare Full 模式回源用)
# Cloudflare 当前配的是 Full 模式(回源 443),所以这个 server 块必须存在。
# 用自签证书即可(Full 而非 Full Strict,CF 不校验证书内容)。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name yangchenjie.com www.yangchenjie.com;

    ssl_certificate     /root/push-relay/backend/cert.pem;
    ssl_certificate_key /root/push-relay/backend/key.pem;

    # SSL 优化(自签证书场景:不强校验)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全头
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # 请求体大小限制
    client_max_body_size 1m;

    # ── 前端静态文件 ──
    location / {
        root /var/www/push-relay;
        index client.html;
        try_files $uri $uri/ /client.html;
    }

    # ── Admin 页面(防止 SPA fallback 兜底成 client.html) ──
    # 注意: alias 不会自动根据 .html 设 Content-Type,必须显式 default_type,
    # 否则浏览器看到 application/octet-stream 会触发下载。
    location = /admin {
        alias /var/www/push-relay/admin.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }

    # ── API 反向代理(普通 HTTP) ──
    location /api/ {
        proxy_pass http://push_relay_backend_https;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── Token 管理 API 限流(防 master 爆破) ──
    location /api/tokens {
        limit_req zone=tokens_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://push_relay_backend_https;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket(独立 location 以支持 Upgrade 头) ──
    location /api/ws {
        proxy_pass http://push_relay_backend_https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接:超时设大
        proxy_connect_timeout 7s;
        proxy_send_timeout    86400s;
        proxy_read_timeout    86400s;

        # 禁用缓冲
        proxy_buffering off;
    }

    # nginx 层健康检查
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 日志
    access_log /var/log/nginx/push-relay-ssl.access.log;
    error_log  /var/log/nginx/push-relay-ssl.error.log;
}