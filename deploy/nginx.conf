# push-relay nginx 反向代理配置
# 部署位置: /etc/nginx/conf.d/push-relay.conf
#
# 场景：Cloudflare 在前面提供 HTTPS（Flexible 或 Full 模式都行）
# - 用户浏览器 → Cloudflare：HTTPS（CF 证书）
# - Cloudflare → ycj nginx：HTTP（nginx 监听 80）
# - nginx → push-relay (8080)：HTTP（内网）
#
# 优势：
# - 不需要在 ycj 上管证书（CF 帮你管）
# - 80 端口直接 serve，无需 SSL 配置
# - 内部全 HTTP，配置简单
#
# 备用：如果 Cloudflare 挂了或想直接访问，可以同时启用 443（自签证书）

# 上游：push-relay 后端（内网 HTTP）
upstream push_relay_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# 主 server（Cloudflare Flexible/Full 模式都用 80）
server {
    listen 80;
    listen [::]:80;
    server_name yangchenjie.com www.yangchenjie.com;

    # Let's Encrypt 验证（如需要）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 安全头
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # 请求体大小限制
    client_max_body_size 1m;

    # ── 前端静态文件 ──
    location / {
        root /var/www/push-relay;
        index client.html;
        try_files $uri $uri/ /client.html;

        # HTML 不缓存，方便更新
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }
    }

    # ── API 反向代理（普通 HTTP） ──
    location /api/ {
        proxy_pass http://push_relay_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── WebSocket（独立 location 以支持 Upgrade 头） ──
    location /api/ws {
        proxy_pass http://push_relay_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接：超时设大
        proxy_connect_timeout 7s;
        proxy_send_timeout    86400s;
        proxy_read_timeout    86400s;

        # 禁用缓冲
        proxy_buffering off;
    }

    # nginx 层健康检查
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 日志
    access_log /var/log/nginx/push-relay.access.log;
    error_log  /var/log/nginx/push-relay.error.log;
}

# 备用 HTTPS server（兼容 CF Full / Full Strict 模式 + 直接 IP 访问）
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yangchenjie.com www.yangchenjie.com;

    ssl_certificate     /etc/nginx/ssl/yangchenjie.com.crt;
    ssl_certificate_key /etc/nginx/ssl/yangchenjie.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 1m;

    # 前端静态
    location / {
        root /var/www/push-relay;
        index client.html;
        try_files $uri $uri/ /client.html;
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }
    }

    # API 反代
    location /api/ {
        proxy_pass http://push_relay_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # WebSocket
    location /api/ws {
        proxy_pass http://push_relay_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7s;
        proxy_send_timeout    86400s;
        proxy_read_timeout    86400s;
        proxy_buffering off;
    }

    access_log /var/log/nginx/push-relay.access.log;
    error_log  /var/log/nginx/push-relay.error.log;
}