<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>push-relay</title>
<style>
  :root {
    --bg: #1a1a1a;
    --panel: #242424;
    --border: #333;
    --text: #e0e0e0;
    --muted: #888;
    --accent: #4ade80;
    --warn: #fbbf24;
    --err: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  h1 { font-size: 16px; font-weight: 600; }
  .status {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 12px;
    background: var(--border);
    color: var(--muted);
  }
  .status.connected { background: #14532d; color: var(--accent); }
  .status.error { background: #7f1d1d; color: var(--err); }
  .count {
    margin-left: auto;
    font-size: 12px;
    color: var(--muted);
  }
  .toolbar {
    padding: 10px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  input[type="text"], input[type="password"] {
    background: #111;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 4px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
  }
  input[type="text"] { flex: 1; min-width: 280px; }
  button {
    background: var(--border);
    color: var(--text);
    border: none;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
  }
  button:hover:not(:disabled) { background: #444; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.primary { background: #166534; }
  button.primary:hover:not(:disabled) { background: #15803d; }
  button.danger { background: #7f1d1d; }
  button.danger:hover:not(:disabled) { background: #991b1b; }
  label.toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
  }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
  }
  .empty {
    color: var(--muted);
    text-align: center;
    margin-top: 60px;
    font-size: 13px;
  }
  .msg {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: 10px 14px;
    margin-bottom: 8px;
    animation: slideIn 0.3s ease-out;
  }
  .msg.tool-use { border-left-color: #60a5fa; }
  .msg.stop { border-left-color: var(--accent); }
  .msg.notification { border-left-color: var(--warn); }
  .msg-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 4px;
  }
  .msg-type {
    font-size: 11px;
    padding: 1px 8px;
    background: #333;
    border-radius: 10px;
    color: var(--muted);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .msg-time {
    font-size: 11px;
    color: var(--muted);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .msg-content {
    font-size: 13px;
    line-height: 1.5;
    word-break: break-word;
  }
  .msg-source {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }
  .msg-badges { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .badge {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 8px;
    background: #333;
    color: var(--muted);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .badge-host { background: #1e3a8a; color: #93c5fd; }
  .badge-tool { background: #78350f; color: #fbbf24; }
  .badge-stop-completed   { background: #14532d; color: var(--accent); }
  .badge-stop-error       { background: #7f1d1d; color: var(--err); }
  .badge-stop-interrupted { background: #4b5563; color: #d1d5db; }
  .msg-task { font-size: 12px; color: var(--muted); margin-top: 4px; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .flash { animation: flash 1s ease-out 3; }
  @keyframes flash {
    0%, 100% { background: var(--bg); }
    50% { background: #422006; }
  }
</style>
</head>
<body>

<header>
  <h1>🔔 push-relay</h1>
  <span id="status" class="status">未连接</span>
  <span class="count">已收到 <span id="count">0</span> 条</span>
</header>

<div class="toolbar">
  <input id="uri" type="text" placeholder="wss://yangchenjie.com/api/ws" value="">
  <input id="token" type="password" placeholder="Token">
  <button id="connect" class="primary">连接</button>
  <button id="disconnect" class="danger" disabled>断开</button>
  <button id="clear">清空</button>
  <label class="toggle"><input type="checkbox" id="soundToggle" checked>声音</label>
  <label class="toggle"><input type="checkbox" id="notifyToggle" checked>桌面通知</label>
  <label class="toggle"><input type="checkbox" id="flashToggle" checked>标题闪烁</label>
  <button id="grantNotif" class="primary" hidden>授权通知</button>
  <span id="notifStatus" class="status error" hidden>通知权限未授权</span>
</div>

<main id="messages">
  <div class="empty">尚未收到消息<br><br>
    点 "连接" 开始接收。Token 来自 <code>~/.zshrc</code> 里的 <code>PUSH_TOKEN</code>。
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const DEFAULT_URI = "wss://yangchenjie.com/api/ws";
// 默认 token（首次打开自动填入，方便使用；用户可改成自己的）
const DEFAULT_TOKEN = "1-EZJNScWGwBo-xid9Fv7P4AwcTn6qNt";
let ws = null;
let messageCount = 0;
let originalTitle = document.title;
let flashInterval = null;

// 配置持久化
function loadConfig() {
  $("uri").value = localStorage.getItem("pr.uri") || DEFAULT_URI;
  $("token").value = localStorage.getItem("pr.token") || DEFAULT_TOKEN;
  $("soundToggle").checked = localStorage.getItem("pr.sound") !== "0";
  $("notifyToggle").checked = localStorage.getItem("pr.notify") !== "0";
  $("flashToggle").checked = localStorage.getItem("pr.flash") !== "0";
}
function saveConfig() {
  localStorage.setItem("pr.uri", $("uri").value);
  localStorage.setItem("pr.token", $("token").value);
  localStorage.setItem("pr.sound", $("soundToggle").checked ? "1" : "0");
  localStorage.setItem("pr.notify", $("notifyToggle").checked ? "1" : "0");
  localStorage.setItem("pr.flash", $("flashToggle").checked ? "1" : "0");
}

// 提示音:Web Audio API 生成简单 beep
// 注意:AudioContext 必须在用户手势(点击/按键)里创建或 resume,
// 否则 Chrome/Safari 会保持 suspended 状态,osc.start() 静默失败。
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
  }
  if (audioCtx.state === "suspended") {
    audioCtx.resume().catch(err => console.warn("[push-relay] AudioContext resume failed:", err));
  }
  return audioCtx;
}
function playBeep() {
  if (!$("soundToggle").checked) return;
  const ctx = ensureAudio();
  if (!ctx) return;
  try {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 880;
    osc.type = "sine";
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    osc.start();
    osc.stop(ctx.currentTime + 0.3);
  } catch (e) {
    console.warn("[push-relay] playBeep failed:", e);
  }
}

// 浏览器原生通知
function showNotification(title, body) {
  if (!$("notifyToggle").checked) return;
  if (!("Notification" in window)) {
    console.warn("[push-relay] 当前浏览器不支持 Notification API");
    return;
  }
  const fire = () => new Notification(title, { body, icon: "🔔", silent: false });
  if (Notification.permission === "granted") {
    fire();
  } else if (Notification.permission === "default") {
    Notification.requestPermission().then(p => {
      updateNotifStatus();
      if (p === "granted") fire();
    });
  } else {
    // denied:什么都不做,updateNotifStatus 会在工具栏提示
  }
  updateNotifStatus();
}

// 把通知权限状态显示到工具栏
function updateNotifStatus() {
  const banner = $("notifStatus");
  const btn    = $("grantNotif");
  if (!("Notification" in window)) {
    banner.hidden = false;
    banner.textContent = "当前浏览器不支持系统通知";
    banner.className = "status error";
    btn.hidden = true;
    return;
  }
  const p = Notification.permission;
  if (p === "granted") {
    banner.hidden = true;
    btn.hidden = true;
  } else if (p === "denied") {
    banner.hidden = false;
    banner.textContent = "通知被拒绝 — 请在浏览器设置里允许";
    banner.className = "status error";
    btn.hidden = true;
  } else {
    banner.hidden = true;
    btn.hidden = false;
  }
}

// 标题闪烁
let flashCount = 0;
function flashTitle(msg) {
  if (!$("flashToggle").checked) return;
  if (flashInterval) clearInterval(flashInterval);
  flashCount = 0;
  flashInterval = setInterval(() => {
    document.title = (flashCount % 2 === 0) ? `🔔 ${msg}` : originalTitle;
    flashCount++;
    if (flashCount > 10) {
      clearInterval(flashInterval);
      flashInterval = null;
      document.title = originalTitle;
    }
  }, 1000);
}

// 渲染消息
function renderMessage(data) {
  const main = $("messages");
  if (main.querySelector(".empty")) main.innerHTML = "";

  // 时区本地化:用 Date 解析 ISO(含时区偏移),再 toLocaleString 转本地
  let localTime = data.timestamp || "";
  try {
    localTime = new Date(data.timestamp || Date.now())
      .toLocaleString("zh-CN", { hour12: false });
  } catch (_) { /* 保留原始 */ }

  const src      = data.source || "?";
  const typ      = data.type    || "notification";
  const content  = data.content || "";
  const host     = data.host    || "";
  const tool     = data.tool    || "";
  const toolIn   = data.tool_input || "";
  const task     = data.task    || "";
  const stopRea  = data.stop_reason || "";

  // 徽章:主机 / 工具 / 停止原因(各自独立维度,只显示有值的)
  const badges = [
    host    && `<span class="badge badge-host">🖥 ${escapeHtml(host)}</span>`,
    tool    && `<span class="badge badge-tool">🔧 ${escapeHtml(tool)}</span>`,
    stopRea && `<span class="badge badge-stop-${escapeHtml(stopRea)}">${escapeHtml(stopRea)}</span>`,
  ].filter(Boolean).join(" ");

  const div = document.createElement("div");
  div.className = `msg ${typ}`;
  div.innerHTML = `
    <div class="msg-head">
      <span class="msg-type">${escapeHtml(typ)}</span>
      <span class="msg-time">${escapeHtml(localTime)}</span>
    </div>
    <div class="msg-content">${escapeHtml(content)}</div>
    ${badges ? `<div class="msg-badges">${badges}</div>` : ""}
    ${toolIn ? `<div class="msg-task">⚙️ ${escapeHtml(toolIn)}</div>` : ""}
    ${task && task !== content ? `<div class="msg-task">📋 ${escapeHtml(task)}</div>` : ""}
    <div class="msg-source">来源: ${escapeHtml(src)}</div>
  `;
  main.prepend(div);

  // 限流:保留最近 200 条
  while (main.children.length > 200) main.removeChild(main.lastChild);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

// 连接
let reconnectTimer = null;
let reconnectDelay = 1000;  // 指数退避起点

function scheduleReconnect() {
  if (reconnectTimer) return;
  if (!$("uri").value || !$("token").value) return;
  reconnectTimer = setTimeout(() => {
    reconnectTimer = null;
    connect();
  }, reconnectDelay);
  reconnectDelay = Math.min(reconnectDelay * 2, 30000);  // 1s → 2s → ... → 30s 上限
}

function connect() {
  if (ws && ws.readyState === WebSocket.OPEN) return;
  saveConfig();
  let uri = $("uri").value.trim();
  const token = $("token").value.trim();
  if (!uri) { setStatus("error", "URI 不能为空"); return; }
  if (token && !uri.includes("token=")) {
    uri += (uri.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(token);
  }

  setStatus("connecting", "连接中...");
  try {
    ws = new WebSocket(uri);
  } catch (e) {
    setStatus("error", "连接失败: " + e.message);
    scheduleReconnect();
    return;
  }

  ws.onopen = () => {
    setStatus("connected", "已连接");
    $("connect").disabled = true;
    $("disconnect").disabled = false;
    reconnectDelay = 1000;  // 成功后重置退避
  };
  ws.onclose = (e) => {
    let msg = "已断开";
    if (e.code === 1006) msg = "连接异常(证书未信任?服务器不可达?)";
    else if (e.code === 1008) msg = "连接策略违规";
    else if (e.code >= 4000) msg = `服务器拒绝(HTTP ${e.code}, 可能是 Token 错误)`;
    setStatus("error", msg + (e.code ? ` [${e.code}]` : ""));
    $("connect").disabled = false;
    $("disconnect").disabled = true;
    ws = null;
    // 自动重连(指数退避)
    scheduleReconnect();
  };
  ws.onerror = () => setStatus("error", "连接错误");
  ws.onmessage = (ev) => {
    let data;
    try { data = JSON.parse(ev.data); }
    catch { data = { content: ev.data }; }
    renderMessage(data);
    messageCount++;
    $("count").textContent = messageCount;
    playBeep();
    // 通知文案:带 type + host + tool
    const notifTitle = [
      data.type || "notification",
      data.host && `🖥 ${data.host}`,
      data.tool && `🔧 ${data.tool}`,
    ].filter(Boolean).join(" · ");
    showNotification(notifTitle, data.content || "");
    flashTitle(data.type || "新消息");
  };
}

function disconnect() {
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  if (ws) ws.close();
}

// 浏览器 tab 切回前台时,若已断开则主动重连
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && (!ws || ws.readyState !== WebSocket.OPEN)) {
    if ($("uri").value && $("token").value) scheduleReconnect();
  }
});

function clearMessages() {
  $("messages").innerHTML = '<div class="empty">已清空</div>';
  messageCount = 0;
  $("count").textContent = 0;
}

function setStatus(cls, text) {
  const el = $("status");
  el.className = "status " + cls;
  el.textContent = text;
}

$("connect").onclick = () => { ensureAudio(); connect(); };
$("disconnect").onclick = disconnect;
$("clear").onclick = () => { ensureAudio(); clearMessages(); };
$("grantNotif").onclick = () => {
  ensureAudio();
  if (!("Notification" in window)) return;
  Notification.requestPermission().then(() => updateNotifStatus());
};
$("uri").onkeydown = e => { if (e.key === "Enter") { ensureAudio(); connect(); } };
$("token").onkeydown = e => { if (e.key === "Enter") { ensureAudio(); connect(); } };
// 任意一次用户点击/按键都把 AudioContext 解锁,避免 ws.onmessage 触发时被 suspend
["click", "keydown"].forEach(ev => {
  document.addEventListener(ev, () => ensureAudio(), { capture: true });
});

loadConfig();
updateNotifStatus();

// 自动连接（首次打开或刷新时）
if ($("token").value && $("uri").value) {
  setTimeout(connect, 500);
}

// 进入页面时不主动弹通知权限框,等用户第一次点 "连接" 或收到第一条消息时再请求,
// 避免页面刚加载就弹窗惹人烦
// (showNotification 内部已处理 permission === "default" 的情况)
</script>
</body>
</html>
