<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>push-relay</title>
<style>
  :root {
    --bg: #1a1a1a;
    --panel: #242424;
    --border: #333;
    --text: #e0e0e0;
    --muted: #888;
    --accent: #4ade80;
    --warn: #fbbf24;
    --err: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  h1 { font-size: 16px; font-weight: 600; }
  .status {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 12px;
    background: var(--border);
    color: var(--muted);
  }
  .status.connected { background: #14532d; color: var(--accent); }
  .status.error { background: #7f1d1d; color: var(--err); }
  .count {
    margin-left: auto;
    font-size: 12px;
    color: var(--muted);
  }
  .toolbar {
    padding: 10px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  input[type="text"], input[type="password"] {
    background: #111;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 4px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
  }
  input[type="text"] { flex: 1; min-width: 280px; }
  button {
    background: var(--border);
    color: var(--text);
    border: none;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
  }
  button:hover:not(:disabled) { background: #444; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.primary { background: #166534; }
  button.primary:hover:not(:disabled) { background: #15803d; }
  button.danger { background: #7f1d1d; }
  button.danger:hover:not(:disabled) { background: #991b1b; }
  label.toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
  }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
  }
  .empty {
    color: var(--muted);
    text-align: center;
    margin-top: 60px;
    font-size: 13px;
  }
  .msg {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: 10px 14px;
    margin-bottom: 8px;
    animation: slideIn 0.3s ease-out;
  }
  .msg.tool-use { border-left-color: #60a5fa; }
  .msg.stop { border-left-color: var(--accent); }
  .msg.notification { border-left-color: var(--warn); }
  .msg-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 4px;
  }
  .msg-type {
    font-size: 11px;
    padding: 1px 8px;
    background: #333;
    border-radius: 10px;
    color: var(--muted);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .msg-time {
    font-size: 11px;
    color: var(--muted);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .msg-content {
    font-size: 13px;
    line-height: 1.5;
    word-break: break-word;
  }
  .msg-source {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .flash { animation: flash 1s ease-out 3; }
  @keyframes flash {
    0%, 100% { background: var(--bg); }
    50% { background: #422006; }
  }
</style>
</head>
<body>

<header>
  <h1>🔔 push-relay</h1>
  <span id="status" class="status">未连接</span>
  <span class="count">已收到 <span id="count">0</span> 条</span>
</header>

<div class="toolbar">
  <input id="uri" type="text" placeholder="wss://yangchenjie.com/api/ws" value="">
  <input id="token" type="password" placeholder="Token">
  <button id="connect" class="primary">连接</button>
  <button id="disconnect" class="danger" disabled>断开</button>
  <button id="clear">清空</button>
  <label class="toggle"><input type="checkbox" id="soundToggle" checked>声音</label>
  <label class="toggle"><input type="checkbox" id="notifyToggle" checked>桌面通知</label>
  <label class="toggle"><input type="checkbox" id="flashToggle" checked>标题闪烁</label>
</div>

<main id="messages">
  <div class="empty">尚未收到消息<br><br>
    点 "连接" 开始接收。Token 来自 <code>~/.zshrc</code> 里的 <code>PUSH_TOKEN</code>。
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const DEFAULT_URI = "wss://yangchenjie.com/api/ws";
// 默认 token（首次打开自动填入，方便使用；用户可改成自己的）
const DEFAULT_TOKEN = "1-EZJNScWGwBo-xid9Fv7P4AwcTn6qNt";
let ws = null;
let messageCount = 0;
let originalTitle = document.title;
let flashInterval = null;

// 配置持久化
function loadConfig() {
  $("uri").value = localStorage.getItem("pr.uri") || DEFAULT_URI;
  $("token").value = localStorage.getItem("pr.token") || DEFAULT_TOKEN;
  $("soundToggle").checked = localStorage.getItem("pr.sound") !== "0";
  $("notifyToggle").checked = localStorage.getItem("pr.notify") !== "0";
  $("flashToggle").checked = localStorage.getItem("pr.flash") !== "0";
}
function saveConfig() {
  localStorage.setItem("pr.uri", $("uri").value);
  localStorage.setItem("pr.token", $("token").value);
  localStorage.setItem("pr.sound", $("soundToggle").checked ? "1" : "0");
  localStorage.setItem("pr.notify", $("notifyToggle").checked ? "1" : "0");
  localStorage.setItem("pr.flash", $("flashToggle").checked ? "1" : "0");
}

// 提示音：Web Audio API 生成简单 beep
let audioCtx = null;
function playBeep() {
  if (!$("soundToggle").checked) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value = 880;
    osc.type = "sine";
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
  } catch (e) { /* ignore */ }
}

// 浏览器原生通知
function showNotification(title, body) {
  if (!$("notifyToggle").checked) return;
  if (!("Notification" in window)) return;
  if (Notification.permission === "granted") {
    new Notification(title, { body, icon: "🔔" });
  } else if (Notification.permission !== "denied") {
    Notification.requestPermission().then(p => {
      if (p === "granted") new Notification(title, { body, icon: "🔔" });
    });
  }
}

// 标题闪烁
let flashCount = 0;
function flashTitle(msg) {
  if (!$("flashToggle").checked) return;
  if (flashInterval) clearInterval(flashInterval);
  flashCount = 0;
  flashInterval = setInterval(() => {
    document.title = (flashCount % 2 === 0) ? `🔔 ${msg}` : originalTitle;
    flashCount++;
    if (flashCount > 10) {
      clearInterval(flashInterval);
      flashInterval = null;
      document.title = originalTitle;
    }
  }, 1000);
}

// 渲染消息
function renderMessage(data) {
  const main = $("messages");
  if (main.querySelector(".empty")) main.innerHTML = "";

  const ts = data.timestamp || new Date().toISOString();
  const src = data.source || "?";
  const typ = data.type || "notification";
  const content = data.content || JSON.stringify(data);

  const div = document.createElement("div");
  div.className = `msg ${typ}`;
  div.innerHTML = `
    <div class="msg-head">
      <span class="msg-type">${escapeHtml(typ)}</span>
      <span class="msg-time">${escapeHtml(ts)}</span>
    </div>
    <div class="msg-content">${escapeHtml(content)}</div>
    <div class="msg-source">来源: ${escapeHtml(src)}</div>
  `;
  main.prepend(div);

  // 限流：保留最近 200 条
  while (main.children.length > 200) main.removeChild(main.lastChild);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

// 连接
function connect() {
  if (ws && ws.readyState === WebSocket.OPEN) return;
  saveConfig();
  let uri = $("uri").value.trim();
  const token = $("token").value.trim();
  if (!uri) { setStatus("error", "URI 不能为空"); return; }
  if (token && !uri.includes("token=")) {
    uri += (uri.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(token);
  }

  setStatus("connecting", "连接中...");
  try {
    ws = new WebSocket(uri);
  } catch (e) {
    setStatus("error", "连接失败: " + e.message);
    return;
  }

  ws.onopen = () => {
    setStatus("connected", "已连接");
    $("connect").disabled = true;
    $("disconnect").disabled = false;
  };
  ws.onclose = (e) => {
    let msg = "已断开";
    if (e.code === 1006) msg = "连接异常（证书未信任？服务器不可达？）";
    else if (e.code === 1008) msg = "连接策略违规";
    else if (e.code >= 4000) msg = `服务器拒绝（HTTP ${e.code}，可能是 Token 错误）`;
    setStatus("error", msg + (e.code ? ` [${e.code}]` : ""));
    $("connect").disabled = false;
    $("disconnect").disabled = true;
    ws = null;
  };
  ws.onerror = () => setStatus("error", "连接错误");
  ws.onmessage = (ev) => {
    let data;
    try { data = JSON.parse(ev.data); }
    catch { data = { content: ev.data }; }
    renderMessage(data);
    messageCount++;
    $("count").textContent = messageCount;
    playBeep();
    showNotification(
      `[${data.type || "notification"}] ${data.source || ""}`,
      data.content || ""
    );
    flashTitle(data.type || "新消息");
  };
}

function disconnect() {
  if (ws) ws.close();
}

function clearMessages() {
  $("messages").innerHTML = '<div class="empty">已清空</div>';
  messageCount = 0;
  $("count").textContent = 0;
}

function setStatus(cls, text) {
  const el = $("status");
  el.className = "status " + cls;
  el.textContent = text;
}

$("connect").onclick = connect;
$("disconnect").onclick = disconnect;
$("clear").onclick = clearMessages;
$("uri").onkeydown = e => { if (e.key === "Enter") connect(); };
$("token").onkeydown = e => { if (e.key === "Enter") connect(); };

loadConfig();

// 自动连接（首次打开或刷新时）
if ($("token").value && $("uri").value) {
  setTimeout(connect, 500);
}

// 进入页面时请求通知权限
if ("Notification" in window && Notification.permission === "default") {
  // 延迟一点请求，避免页面刚加载就弹窗
  setTimeout(() => Notification.requestPermission(), 2000);
}
</script>
</body>
</html>
